<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Pro Ultra</title>

<style>
:root {
    --bg-color: #0f172a;
    --calc-bg: #1e293b;
    --btn-gray: #334155;
    --btn-accent: #3b82f6;
    --btn-danger: #ef4444;
    --text-main: #f8fafc;
    --display-bg: #020617;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--bg-color);
    font-family: 'Inter', system-ui, sans-serif;
}

.calculadora {
    background: var(--calc-bg);
    padding: 24px;
    border-radius: 32px;
    width: 340px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}

/* DISPLAY */
.display-container {
    background: var(--display-bg);
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 20px;
    text-align: right;
    color: var(--text-main);
    font-size: 32px;
    overflow-x: auto;
}

/* BOTÕES */
.botoes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

button {
    padding: 18px;
    font-size: 18px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    background: var(--btn-gray);
    color: white;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

.operador {
    background: var(--btn-accent);
}

.limpar {
    background: var(--btn-danger);
}

.igual {
    background: green;
    grid-column: span 2;
}
</style>
</head>

<body>

<div class="calculadora">
    <div id="display" class="display-container">0</div>

    <div class="botoes">
        <button class="limpar" onclick="limpar()">C</button>
        <button onclick="add('(')">(</button>
        <button onclick="add(')')">)</button>
        <button class="operador" onclick="add('/')">÷</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operador" onclick="add('*')">×</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operador" onclick="add('-')">−</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button class="operador" onclick="add('+')">+</button>

        <button onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
        <button class="igual" onclick="calcular()">=</button>
    </div>
</div>

<script>
let display = document.getElementById("display");

function add(valor) {
    if (display.innerText === "0") {
        display.innerText = valor;
    } else {
        display.innerText += valor;
    }
}

function limpar() {
    display.innerText = "0";
}

function calcular() {
    try {
        display.innerText = eval(display.innerText);
    } catch {
        display.innerText = "Erro";
    }
}
</script>

</body>
</html>
